name: Addon catalog 3.3.5a

# Rebuilds the 3.3.5a addon catalog for the private server game version and publishes it to the
# `addon-catalog-335` branch as catalog-335.json (fetched by the app from raw.githubusercontent.com).
on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - catalog/wotlk335.json
      - tools/catalog/build_catalog_335.py

permissions:
  contents: write

concurrency:
  group: addon-catalog-335
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/catalog/build_catalog_335.py catalog/wotlk335.json "$RUNNER_TEMP/catalog-335.json"

      - name: Publish to addon-catalog-335 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin addon-catalog-335 >/dev/null; then
            git fetch --depth 1 origin addon-catalog-335
            git switch addon-catalog-335
          else
            git switch --orphan addon-catalog-335
            git rm -rf --quiet . || true
          fi
          cp "$RUNNER_TEMP/catalog-335.json" catalog-335.json
          git add catalog-335.json
          if git diff --cached --quiet -I '"generated"'; then
            echo "Catalog unchanged"
            exit 0
          fi
          git commit -m "Update 3.3.5a addon catalog"
          git push origin addon-catalog-335
